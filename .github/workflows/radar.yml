name: Next OpenClaw Radar

on:
  schedule:
    # 06:00 UTC = 08:00 Amsterdam during CEST
    # GitHub Actions cron is UTC; the workflow below also checks the
    # Amsterdam timezone so the DST transition is handled safely.
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check Amsterdam time
        id: time
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Amsterdam"))
          print("Amsterdam time:", now.isoformat())

          # Only continue if it is the 08:00 hour.
          # GitHub cron itself is UTC, so this protects against DST changes.
          if now.hour != 8:
              print("Not 08:00 Amsterdam; stopping.")
              with open("$GITHUB_OUTPUT", "a") as f:
                  f.write("run=false\n")
          else:
              print("Correct time; running radar.")
              with open("$GITHUB_OUTPUT", "a") as f:
                  f.write("run=true\n")
          PY

      - name: Run radar
        if: steps.time.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: |
          python next_openclaw_radar.py \
            --limit 50 \
            --days 7 \
            --out openclaw-radar

      - name: Commit radar results
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add openclaw-radar/

          if git diff --cached --quiet; then
            echo "No radar changes."
          else
            git commit -m "Update Next OpenClaw Radar"
            git push
          fi
